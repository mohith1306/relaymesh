<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelayMesh Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: #1e293b; padding: 1rem 2rem; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 1.5rem; color: #38bdf8; }
        .header p { color: #94a3b8; font-size: 0.875rem; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; max-width: 1400px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 0.5rem; border: 1px solid #334155; padding: 1rem; }
        .card h2 { font-size: 1rem; color: #38bdf8; margin-bottom: 0.75rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .full-width { grid-column: 1 / -1; }
        .node-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .node-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: #0f172a; border-radius: 0.375rem; border: 1px solid #334155; }
        .node-id { font-weight: 600; color: #38bdf8; }
        .node-state { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 500; }
        .state-connected { background: #065f46; color: #34d399; }
        .state-discovering { background: #713f12; color: #fbbf24; }
        .state-relaying { background: #1e40af; color: #60a5fa; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
        .metric { background: #0f172a; padding: 0.75rem; border-radius: 0.375rem; text-align: center; border: 1px solid #334155; }
        .metric-value { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .metric-label { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
        .topology-canvas { width: 100%; height: 300px; background: #0f172a; border-radius: 0.375rem; border: 1px solid #334155; }
        .status-bar { display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .refresh-btn { background: #38bdf8; color: #0f172a; border: none; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-weight: 500; }
        .refresh-btn:hover { background: #7dd3fc; }
        .link-list { max-height: 200px; overflow-y: auto; }
        .link-item { display: flex; justify-content: space-between; padding: 0.5rem; background: #0f172a; border-radius: 0.25rem; margin-bottom: 0.25rem; font-size: 0.875rem; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="header">
        <h1>RelayMesh Dashboard</h1>
        <div class="status-bar">
            <div class="status-dot"></div>
            <span>Live Monitoring</span>
            <button class="refresh-btn" onclick="refresh()">Refresh</button>
            <span id="lastUpdate" style="color: #64748b; font-size: 0.75rem;"></span>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Network Nodes</h2>
            <div id="nodeList" class="node-list">Loading...</div>
        </div>

        <div class="card">
            <h2>Network Metrics</h2>
            <div id="metricsGrid" class="metrics-grid">Loading...</div>
        </div>

        <div class="card full-width">
            <h2>Network Topology</h2>
            <canvas id="topologyCanvas" class="topology-canvas"></canvas>
        </div>

        <div class="card">
            <h2>Active Links</h2>
            <div id="linkList" class="link-list">Loading...</div>
        </div>

        <div class="card">
            <h2>AI Status</h2>
            <div id="aiStatus" style="padding: 1rem;">
                <div class="metric">
                    <div class="metric-value" id="aiStatusValue">--</div>
                    <div class="metric-label">AI Service</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let canvas, ctx;
        let nodes = [];
        let links = [];

        function init() {
            canvas = document.getElementById('topologyCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            refresh();
            setInterval(refresh, 3000);
        }

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drawTopology();
        }

        async function refresh() {
            try {
                const stateRes = await fetch('/api/state');
                const state = await stateRes.json();

                const topoRes = await fetch('/api/topology');
                const topo = await topoRes.json();

                nodes = topo.nodes || [];
                links = topo.edges || [];

                renderNodes(state.nodes || []);
                renderMetrics(state.metrics || {});
                renderLinks(links);
                drawTopology();

                document.getElementById('lastUpdate').textContent =
                    'Updated: ' + new Date().toLocaleTimeString();
            } catch (e) {
                console.error('Refresh failed:', e);
            }
        }

        function renderNodes(nodeList) {
            const container = document.getElementById('nodeList');
            if (!nodeList.length) {
                container.innerHTML = '<div style="color: #64748b;">No nodes found</div>';
                return;
            }
            container.innerHTML = nodeList.map(n => `
                <div class="node-item">
                    <div>
                        <span class="node-id">${n.id}</span>
                        <span style="color: #64748b; margin-left: 0.5rem;">:${n.port}</span>
                    </div>
                    <div>
                        <span class="node-state state-${n.state.toLowerCase()}">${n.state}</span>
                        <span style="color: #64748b; margin-left: 0.5rem; font-size: 0.75rem;">${n.peers.length} peers</span>
                    </div>
                </div>
            `).join('');
        }

        function renderMetrics(metrics) {
            const container = document.getElementById('metricsGrid');
            const keys = Object.keys(metrics);
            if (!keys.length) {
                container.innerHTML = '<div style="color: #64748b;">No metrics</div>';
                return;
            }

            let avgLatency = 0, avgLoss = 0, avgBw = 0, totalNodes = keys.length;
            keys.forEach(k => {
                avgLatency += metrics[k].latency || 0;
                avgLoss += metrics[k].packet_loss || 0;
                avgBw += metrics[k].bandwidth || 0;
            });

            container.innerHTML = `
                <div class="metric">
                    <div class="metric-value">${totalNodes}</div>
                    <div class="metric-label">Active Nodes</div>
                </div>
                <div class="metric">
                    <div class="metric-value">${(avgLatency/totalNodes).toFixed(1)}</div>
                    <div class="metric-label">Avg Latency (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value">${(avgLoss/totalNodes*100).toFixed(1)}%</div>
                    <div class="metric-label">Avg Packet Loss</div>
                </div>
                <div class="metric">
                    <div class="metric-value">${(avgBw/totalNodes).toFixed(0)}</div>
                    <div class="metric-label">Avg Bandwidth (Mbps)</div>
                </div>
            `;
        }

        function renderLinks(linkList) {
            const container = document.getElementById('linkList');
            if (!linkList.length) {
                container.innerHTML = '<div style="color: #64748b;">No active links</div>';
                return;
            }
            container.innerHTML = linkList.map(l => `
                <div class="link-item">
                    <span>${l.source} → ${l.target}</span>
                    <span style="color: #94a3b8;">${l.latency.toFixed(1)}ms | ${(l.packet_loss*100).toFixed(1)}% loss</span>
                </div>
            `).join('');
        }

        function drawTopology() {
            if (!ctx || !canvas) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!nodes.length) {
                ctx.fillStyle = '#64748b';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No nodes discovered yet', canvas.width/2, canvas.height/2);
                return;
            }

            const padding = 50;
            const width = canvas.width - padding * 2;
            const height = canvas.height - padding * 2;

            const positions = {};
            nodes.forEach((node, i) => {
                const angle = (2 * Math.PI * i) / nodes.length - Math.PI / 2;
                positions[node.id] = {
                    x: padding + width/2 + (width/2 * 0.7) * Math.cos(angle),
                    y: padding + height/2 + (height/2 * 0.7) * Math.sin(angle),
                };
            });

            links.forEach(link => {
                const from = positions[link.source];
                const to = positions[link.target];
                if (from && to) {
                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(to.x, to.y);
                    ctx.strokeStyle = link.active ? '#38bdf8' : '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    const midX = (from.x + to.x) / 2;
                    const midY = (from.y + to.y) / 2;
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${link.latency.toFixed(0)}ms`, midX, midY - 5);
                }
            });

            nodes.forEach(node => {
                const pos = positions[node.id];
                if (!pos) return;

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, 2 * Math.PI);
                ctx.fillStyle = node.state === 'RELAYING' ? '#22c55e' :
                               node.state === 'CONNECTED' ? '#38bdf8' :
                               node.state === 'DISCOVERING' ? '#fbbf24' : '#64748b';
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(node.id.replace('node-', ''), pos.x, pos.y);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px sans-serif';
                ctx.fillText(`:${node.port}`, pos.x, pos.y + 30);
            });
        }

        init();
    </script>
</body>
</html>
