services:
  - type: web
    name: relaymesh-relay
    runtime: docker
    dockerfilePath: Dockerfile
    port: 8080
    envVars:
      - key: PORT
        value: 8080

  - type: web
    name: relaymesh-ai
    runtime: docker
    dockerfilePath: ai/Dockerfile
    port: 50051
    envVars:
      - key: PORT
        value: 50051

